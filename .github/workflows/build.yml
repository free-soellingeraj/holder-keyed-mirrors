name: build

# Runs the same ./build.sh as a contributor would, and attaches the .docx to
# the run so anyone can download it without installing the tools.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Mermaid CLI
        run: npm install --global @mermaid-js/mermaid-cli@11.12.0

      - name: Install pandoc
        # Pinned to the version the maintainers build with, from pandoc's own release page:
        # the runner's package mirror has failed to resolve, and its pandoc is older.
        env:
          PANDOC_VERSION: "3.9.0.2"
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg --install pandoc.deb
          rm pandoc.deb
          pandoc --version | head -n 1

      - name: Build
        run: ./build.sh

      - name: Upload the .docx
        uses: actions/upload-artifact@v4
        with:
          name: holder-keyed-mirrors-docx
          path: build/holder-keyed-mirrors.docx
          if-no-files-found: error
